<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мы</title>
    <script src="https://telegram.org"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: url('https://s6.iimage.su/s/21/th_gDUtTtNxiC1FUs6L7vmNiQe8JgOQWTpjjfNnbNEe3.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35); z-index: 1;
        }
        .container {
            position: relative; z-index: 2;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 35px 25px; border-radius: 30px;
            width: 90%; max-width: 360px; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .heart { font-size: 40px; margin-bottom: 10px; animation: pulse 1.6s infinite ease-in-out; display: inline-block; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        h1 { color: #ffffff; font-size: 24px; font-weight: 700; margin: 0 0 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .subtitle { color: rgba(255, 255, 255, 0.85); font-size: 14px; font-weight: 300; margin-bottom: 30px; }
        .timer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .timer-item {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 10px; border-radius: 20px; backdrop-filter: blur(4px);
        }
        .number { display: block; color: #ffffff; font-size: 32px; font-weight: 600; line-height: 1; }
        .label { display: block; color: rgba(255, 255, 255, 0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 8px; font-weight: 400; }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1>Мы вместе уже</h1>
        <div class="subtitle">каждое мгновение бесценно</div>
        <div class="timer-grid">
            <div class="timer-item"><span class="number" id="days">0</span><span class="label">Дней</span></div>
            <div class="timer-item"><span class="number" id="hours">0</span><span class="label">Часов</span></div>
            <div class="timer-item"><span class="number" id="minutes">0</span><span class="label">Минут</span></div>
            <div class="timer-item"><span class="number" id="seconds">0</span><span class="label">Секунд</span></div>
        </div>
    </div>
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready(); tg.expand();
        }

        const startDate = new Date(2026, 7, 23, 12, 30, 0); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            if (diff < 0) {
                document.getElementById('days').innerText = 0;
                document.getElementById('hours').innerText = 0;
                document.getElementById('minutes').innerText = 0;
                document.getElementById('seconds').innerText = 0;
                return;
            }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('days').innerText = d;
            document.getElementById('hours').innerText = h;
            document.getElementById('minutes').innerText = m;
            document.getElementById('seconds').innerText = s;
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
